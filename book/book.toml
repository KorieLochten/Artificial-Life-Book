[book]
title = "Artificial Life"
authors = []
language = "en"
src = "src"

[build]
build-dir = "../dist"

[output.html.playground]
editable = false
runnable = false

[output.html]
mathjax-support = true
default-theme = "navy"
preferred-dark-theme = "navy"
smart-punctuation = true
additional-css = ["global.css"]
additional-js = ["global.js"]
no-section-label = false
git-repository-url = "https://github.com/KorieLochten/Artificial-Life-Book"
git-repository-icon = "fab-github"
site-url = "/Artificial-Life-Book/"
input-404 = "not-found.md"

[output.html.print]
enable = false
