name: Video render candidates

on:
  push:
    branches: [main]
    paths:
      - 'animations/**'
      - 'scripts/video.js'
      - '.github/workflows/videos.yml'
  pull_request:
    paths:
      - 'animations/**'
      - 'scripts/video.js'
      - '.github/workflows/videos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: videos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Render the neighborhood preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Cairo, Pango, and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcairo2-dev libpango1.0-dev build-essential python3-dev fonts-dejavu-core

      - name: Prepare the locked Manim environment
        run: npm run video:setup

      - name: Render the preview video and final frame
        run: npm run video:preview

      - name: Upload render candidates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manim-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/manim/**/*.mp4
            .cache/manim/**/*.png
            !.cache/manim/**/partial_movie_files/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
